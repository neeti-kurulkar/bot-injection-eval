[project]
name = "sahayak"
version = "0.0.0"
description = "Measurement study of injection-driven failures in a tiered mock bank support bot (research prototype)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sahayak"]

[tool.pytest.ini_options]
testpaths = ["tests"]
